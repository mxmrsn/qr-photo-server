{% extends "base.html" %}
{% block title %}The album — {{ s.couple_names }}{% endblock %}

{% block body %}
{% include "_header.html" %}

<nav class="subnav">
  <a href="/">Add yours</a>
  <a href="/gallery" class="on">The album</a>
</nav>

<div class="wrap" style="max-width:1180px">
  <div class="stats" id="stats"></div>

  <div id="notes" style="max-width:620px;margin:0 auto 30px"></div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">
    <p>No photos yet — be the first.</p>
    <a class="btn" href="/" style="max-width:260px;margin:14px auto 0">Add a photo</a>
  </div>
  <div id="sentinel" style="height:40px"></div>
</div>

{% include "_footer.html" %}

<div class="lightbox" id="lightbox">
  <button class="x" id="lbClose" aria-label="Close">&times;</button>
  <button class="nav prev" id="lbPrev" aria-label="Previous">&#8249;</button>
  <button class="nav next" id="lbNext" aria-label="Next">&#8250;</button>
  <div style="text-align:center;max-width:100%">
    <div id="lbStage"></div>
    <div class="cap" id="lbCap"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>window.GALLERY = { allowDownload: {{ 'true' if s.allow_guest_download else 'false' }} };</script>
<script src="/static/js/gallery.js"></script>
{% endblock %}
